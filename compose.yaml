services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datashare
      POSTGRES_USER: datashare
      POSTGRES_PASSWORD: datashare
    ports:
      - "5432:5432"
    volumes:
      - datashare-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashare -d datashare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datashare-postgres-data:
