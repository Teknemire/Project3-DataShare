spring.application.name=datashare-backend
debug=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/datashare}
spring.datasource.username=${DB_USERNAME:datashare}
spring.datasource.password=${DB_PASSWORD:datashare}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1001MB

# Laisse le temps de transmettre les fichiers volumineux aux clients lents.
spring.mvc.async.request-timeout=${DOWNLOAD_STREAM_TIMEOUT:3600s}

server.error.include-message=never
server.error.include-stacktrace=never

logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
logging.level.org.hibernate.SQL=INFO

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=PT1H

app.frontend.public-url=${FRONTEND_PUBLIC_URL:http://localhost:4200}
app.storage.type=${STORAGE_TYPE:local}
app.storage.local.path=${LOCAL_STORAGE_PATH:./storage}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${S3_REGION:}
app.files.expiration-cleanup-delay-ms=${EXPIRATION_CLEANUP_DELAY_MS:900000}
app.files.download-ticket-expiration=${DOWNLOAD_TICKET_EXPIRATION:PT1M}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
app.rate-limit.uploads-per-minute=${RATE_LIMIT_UPLOADS_PER_MINUTE:10}
app.rate-limit.downloads-per-minute=${RATE_LIMIT_DOWNLOADS_PER_MINUTE:20}
