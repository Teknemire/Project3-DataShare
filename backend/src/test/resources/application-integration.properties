spring.datasource.url=jdbc:h2:mem:datashare-integration;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
app.rate-limit.enabled=false
spring.jpa.open-in-view=false

app.jwt.secret=DataShareIntegrationJwtSecret1234567890
app.jwt.expiration=PT1H
app.frontend.public-url=http://localhost:4200
app.storage.type=local
app.storage.local.path=./target/integration-storage
app.files.expiration-cleanup-delay-ms=3600000
app.files.download-ticket-expiration=PT1M

logging.level.org.hibernate.SQL=WARN
