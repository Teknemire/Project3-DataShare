spring.application.name=datashare-backend
debug=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/datashare}
spring.datasource.username=${DB_USERNAME:datashare}
spring.datasource.password=${DB_PASSWORD:datashare}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.error.include-message=never
server.error.include-stacktrace=never

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=PT1H
